name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extracting the multi-GB Rider SDK overflows the stock runner disk without this
      # (tool-cache + large-packages are the settings that actually free space).
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle (incl. downloaded Rider SDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Tests dump a spawned Windows process, so CI only builds the zip.
      - run: ./gradlew --no-daemon --console=plain buildPlugin "-Dorg.gradle.java.installations.paths=$JAVA_HOME"

      - name: Publish GitHub release with the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

      # Keep the custom plugin repository (updatePlugins.xml on main) pointing at this release,
      # so IDEs with the repository URL configured see the update.
      - name: Update updatePlugins.xml on main
        run: |
          # A re-run of an older tag must not point the repository back at an old version.
          git fetch --tags origin
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ "$GITHUB_REF_NAME" = "$LATEST" ] || { echo "not the newest tag ($LATEST), XML untouched"; exit 0; }
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP=$(basename build/distributions/*.zip)
          SINCE=$(grep -oP 'pluginSinceBuild\s*=\s*\K\S+' gradle.properties)
          UNTIL=$(grep -oP 'pluginUntilBuild\s*=\s*\K\S+' gradle.properties)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Custom plugin repository (JetBrains "Manage Plugin Repositories" format).
               Add https://raw.githubusercontent.com/gaetan-deturche/rider-process-dump/main/updatePlugins.xml
               in Settings | Plugins | gear | Manage Plugin Repositories to receive updates.
               Regenerated by the release workflow on every v* tag. -->
          <plugins>
            <plugin id="dev.processdump"
                    url="https://github.com/gaetan-deturche/rider-process-dump/releases/download/${GITHUB_REF_NAME}/${ZIP}"
                    version="${VERSION}">
              <idea-version since-build="${SINCE}" until-build="${UNTIL}"/>
            </plugin>
          </plugins>
          EOF
          sed -i 's/^          //' updatePlugins.xml
          # Staged diff, so the first run (file not tracked yet) commits too.
          git add updatePlugins.xml
          if ! git diff --cached --quiet; then
            git commit -m "Point updatePlugins.xml at ${GITHUB_REF_NAME}"
            git push origin main
          fi
